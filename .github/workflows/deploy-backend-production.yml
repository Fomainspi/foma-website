name: Deploy Production Backend to AWS

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend-production.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy-backend:
    name: Deploy Production Backend
    runs-on: ubuntu-latest
    environment: production

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Build SAM application
        run: sam build

      - name: Deploy Production SAM stack
        run: |
          sam deploy \
            --config-env prod \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

      - name: Show deployed API endpoint
        run: |
          aws cloudformation describe-stacks \
            --stack-name foma-backend-prod \
            --query 'Stacks[0].Outputs[?OutputKey==`ApiEndpoint` || OutputKey==`RegisterEndpoint` || OutputKey==`NewsletterSubscribeEndpoint`].[OutputKey,OutputValue]' \
            --output table

      - name: Smoke test production newsletter subscription
        run: |
          set -euo pipefail
          endpoint="https://7gd3r709wf.execute-api.ap-southeast-1.amazonaws.com/prod/newsletter/subscribe"
          response_file="/tmp/newsletter-response.json"
          http_code=$(curl -sS -o "$response_file" -w "%{http_code}" \
            -X POST "$endpoint" \
            -H 'Content-Type: application/json' \
            --data '{"email":"success@simulator.amazonses.com"}')
          cat "$response_file"
          test "$http_code" = "201"
