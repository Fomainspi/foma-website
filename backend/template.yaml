AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  FOMA serverless backend for Bootcamp registration and newsletter subscriptions.
  Dev and Production use separate CloudFormation stacks and runtime resources.
  The legacy bootcamp-registration backend remains untouched as a rollback path.

Parameters:
  EnvironmentName:
    Type: String
    AllowedValues:
      - dev
      - prod
    Default: dev

  AllowedOrigin:
    Type: String
    Description: Exact website origin allowed to call the HTTP API.

  SesSenderEmail:
    Type: String
    Description: SES-verified From address used for FOMA emails.

  SesAdminRecipientEmail:
    Type: String
    Description: FOMA admin mailbox receiving registration notifications.

  NewsletterContactListName:
    Type: String
    Default: FOMA-Newsletter
    Description: Name of the existing SES v2 contact list used for newsletter subscriptions.
    AllowedPattern: "^[A-Za-z0-9_-]+$"

  NewsletterTopicName:
    Type: String
    Default: FOMA-Newsletter
    Description: Name of the topic inside the newsletter contact list.
    AllowedPattern: "^[A-Za-z0-9_-]+$"

  SesAllowedTestRecipients:
    Type: CommaDelimitedList
    Default: ""
    Description: Dev-only allowlist for student confirmation emails.

  ApiThrottlingRateLimit:
    Type: Number
    Default: 5

  ApiThrottlingBurstLimit:
    Type: Number
    Default: 10

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 10
    MemorySize: 128
    Tracing: Active
    Environment:
      Variables:
        ENVIRONMENT_NAME: !Ref EnvironmentName

Resources:
  # The SES contact list is created exactly once as infrastructure by this
  # stack (DeletionPolicy/UpdateReplacePolicy: Retain so the existing list
  # and its contacts are never deleted by stack operations). The subscribe
  # Lambda only adds/updates contacts inside this list.
  NewsletterContactList:
    Type: AWS::SES::ContactList
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ContactListName: !Ref NewsletterContactListName
      Description: FOMA Foundation of Mastering Automation newsletter subscribers.
      Topics:
        - TopicName: !Ref NewsletterTopicName
          DisplayName: FOMA Newsletter
          Description: Practical DevOps, DevSecOps, Cloud, Kubernetes and automation insights from Foundation of Mastering Automation.
          DefaultSubscriptionStatus: OPT_OUT

  RegistrationsTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      TableName: !Sub "foma-registrations-${EnvironmentName}"
      PrimaryKey:
        Name: registrationId
        Type: String
      SSESpecification:
        SSEEnabled: true
      Tags:
        Environment: !Ref EnvironmentName
        Project: foma-backend

  RegistrationApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref EnvironmentName
      CorsConfiguration:
        AllowOrigins:
          - !Ref AllowedOrigin
        AllowMethods:
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type
      DefaultRouteSettings:
        ThrottlingRateLimit: !Ref ApiThrottlingRateLimit
        ThrottlingBurstLimit: !Ref ApiThrottlingBurstLimit

  RegisterFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "foma-register-${EnvironmentName}"
      CodeUri: src/functions/register/
      Handler: index.handler
      Description: !Sub "FOMA bootcamp registration handler (${EnvironmentName})"
      Environment:
        Variables:
          TABLE_NAME: !Ref RegistrationsTable
          SES_SENDER_EMAIL: !Ref SesSenderEmail
          SES_ADMIN_RECIPIENT_EMAIL: !Ref SesAdminRecipientEmail
          SES_ALLOWED_TEST_RECIPIENTS: !Join [",", !Ref SesAllowedTestRecipients]
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref RegistrationsTable
        - Statement:
            - Sid: AllowSendFromEnvironmentSenderOnly
              Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/${SesSenderEmail}"
      Events:
        RegisterPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref RegistrationApi
            Path: /register
            Method: POST

  SubscribeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "foma-newsletter-subscribe-${EnvironmentName}"
      CodeUri: src/functions/subscribe/
      Handler: index.handler
      Description: !Sub "FOMA newsletter subscription handler (${EnvironmentName})"
      Environment:
        Variables:
          NEWSLETTER_CONTACT_LIST_NAME: !Ref NewsletterContactListName
          NEWSLETTER_TOPIC_NAME: !Ref NewsletterTopicName
          SES_SENDER_EMAIL: !Ref SesSenderEmail
      Policies:
        - Statement:
            # The contact list is created by this stack (see NewsletterContactList),
            # never by the Lambda. The Lambda only manages contacts inside it.
            - Sid: ManageFomaNewsletterContacts
              Effect: Allow
              Action:
                - ses:CreateContact
                - ses:GetContact
                - ses:UpdateContact
              Resource: !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:contact-list/${NewsletterContactListName}"
            - Sid: SendFomaNewsletterWelcomeEmail
              Effect: Allow
              Action:
                - ses:SendEmail
              Resource:
                - !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/${SesSenderEmail}"
                - !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:contact-list/${NewsletterContactListName}"
      Events:
        SubscribePost:
          Type: HttpApi
          Properties:
            ApiId: !Ref RegistrationApi
            Path: /newsletter/subscribe
            Method: POST

Outputs:
  ApiEndpoint:
    Description: Base URL of the generated API Gateway HTTPS endpoint.
    Value: !Sub "https://${RegistrationApi}.execute-api.${AWS::Region}.amazonaws.com/${EnvironmentName}"

  RegisterEndpoint:
    Description: Full URL for the registration POST route.
    Value: !Sub "https://${RegistrationApi}.execute-api.${AWS::Region}.amazonaws.com/${EnvironmentName}/register"

  NewsletterSubscribeEndpoint:
    Description: Full URL for the newsletter subscription POST route.
    Value: !Sub "https://${RegistrationApi}.execute-api.${AWS::Region}.amazonaws.com/${EnvironmentName}/newsletter/subscribe"

  TableName:
    Description: Name of the DynamoDB table for this environment.
    Value: !Ref RegistrationsTable

  FunctionArn:
    Description: ARN of the registration Lambda function for this environment.
    Value: !GetAtt RegisterFunction.Arn

  NewsletterFunctionArn:
    Description: ARN of the newsletter subscription Lambda function.
    Value: !GetAtt SubscribeFunction.Arn

  NewsletterContactListName:
    Description: Name of the SES contact list used for newsletter subscriptions.
    Value: !Ref NewsletterContactListName
