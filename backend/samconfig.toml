version = 0.1

# Deploys a single, isolated CloudFormation stack per environment.
# Dev and Production use separate stacks, APIs, Lambdas, DynamoDB tables,
# and IAM roles.

[dev.deploy.parameters]
stack_name = "foma-backend-dev"
resolve_s3 = true
s3_prefix = "foma-backend-dev"
region = "ap-southeast-1"
confirm_changeset = true
capabilities = "CAPABILITY_IAM"
parameter_overrides = [
    "EnvironmentName=dev",
    "AllowedOrigin=https://dev.foma.life",
    "SesSenderEmail=bootcamp@foma.life",
    "SesAdminRecipientEmail=bootcamp@foma.life",
    "SesAllowedTestRecipients=bootcamp@foma.life",
    "ApiThrottlingRateLimit=5",
    "ApiThrottlingBurstLimit=10"
]

[prod.deploy.parameters]
stack_name = "foma-backend-prod"
resolve_s3 = true
s3_prefix = "foma-backend-prod"
region = "ap-southeast-1"
confirm_changeset = true
capabilities = "CAPABILITY_IAM"
parameter_overrides = [
    "EnvironmentName=prod",
    "AllowedOrigin=https://foma.life",
    "SesSenderEmail=bootcamp@foma.life",
    "SesAdminRecipientEmail=bootcamp@foma.life",
    "SesAllowedTestRecipients=",
    "ApiThrottlingRateLimit=5",
    "ApiThrottlingBurstLimit=10"
]
